# Render Blueprint — Sri Lakshmi Roofing Industry
#
# This single file tells Render to create BOTH the website and its
# PostgreSQL database, and to wire them together automatically.
#
# To use it: push this project to GitHub, then in the Render dashboard
# choose "New +" -> "Blueprint" and select your repository.
# Render reads this file and sets everything up. See DEPLOY.md for the
# full click-by-click walkthrough.

databases:
  - name: srilakshmi-db
    databaseName: srilakshmi_roofing
    user: srilakshmi_user
    plan: free

services:
  - type: web
    name: srilakshmi-roofing
    runtime: python
    plan: free
    region: singapore          # Closest Render region to Telangana, India
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      # Connection string is injected automatically from the database above —
      # you never have to copy/paste a password anywhere.
      - key: DATABASE_URL
        fromDatabase:
          name: srilakshmi-db
          property: connectionString

      # Render generates a strong random secret key on first deploy.
      - key: FLASK_SECRET_KEY
        generateValue: true

      - key: FLASK_ENV
        value: production

      # Pinned so builds stay reproducible. psycopg2-binary 2.9.9 has
      # prebuilt wheels for 3.11 — newer Python versions can fail to build.
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Update this to your real domain once you have one. It feeds
      # canonical URLs, Open Graph tags, sitemap.xml and robots.txt.
      - key: SITE_DOMAIN
        value: https://srilakshmi-roofing.onrender.com
